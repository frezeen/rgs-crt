# Profile: rgs-stock — stock RGS behavior, engine inside, unnoticed.
# NO session keys, NO files, NO binaries, NO patches: the LCD session
# display target is owned by the solo-prep (CRT off, LCD re-armed to the
# EDID preferred from a clean state — the two-call form, measured
# 2026-09-14 AMD R9 270X), the launch itself is stock+patch end to end.
# ONE exception, the Lindbergh NIC shield below: that title rewrites eth0 a
# few seconds in and, with the roms on an NFS hard mount, strands and freezes
# the box on the LCD exactly as on the tube.
# ONE more, the launcher stdio detach in [runtime] below: the RGS gamescope
# wrapper leaves pipe holders alive, so the stock EOF wait stalls the exit
# until the display layer's grace — the same fix on the LCD.
label = RGS stock (compat)
description = Stock RGS behavior with the engine inside — changes nothing

[global]
[display]
target = lcd
[runtime]
# The stock launcher returns on the game's pipe EOF, but gamescope's reaper and the wine services inherit those pipes and outlive the game: detach the game's stdio so the launcher returns with its direct child (src: configgen)
env = RGS_STDIO_DETACH=1

# ── Sega Lindbergh (its AM OS network stack must not touch the host NIC) ──
[lindbergh]
[configs]
# The title runs `ifconfig eth0 addr 192.168.38.x` and `route del -net default`
# a few seconds in. With /userdata/roms on an NFS hard mount the NAS vanishes,
# the title blocks in an NFS RPC (state D) and the box freezes with it. These
# shims swallow the writes and report the real interface (any subnet); the
# stock tools return at gameStop and by crash-clean at boot.
lindbergh/ifconfig = /sbin/ifconfig
lindbergh/route = /sbin/route

# ── bezel-fill demo:
# the stock pack forces mame.integerscale=1 while its game-level art
# holes are sized for the 4:3 full fit (measured: hole 1403x1044 vs 4x
# frame 1196x896 on 88games; census 4216 artworks). This ONE session
# key (applied at gameStart before configgen resolves it, value-restored
# at gameStop, disk default untouched) makes every game fill its hole:
# portrait holes self-fill, landscape 2767/2835 exact, 68 wide-art keep
# reduced bars. Left commented as the example of a one-line, no-filesystem
# corrective; uncomment [mame] + the key to enable.
#[mame]
#[batocera.conf]
#mame.integerscale = 0
