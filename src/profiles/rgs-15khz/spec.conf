nesicax.videomode = 640x480i
# INVERSION OF RGS's LCD ADAPTATION (owner 2026-10-19). RGS presents the
# ORIGINAL 4:3 titles stretched on its 16:9 LCD: the dumps carry a widescreen
# backbuffer — MEASURED in the dumps' own configs: Hyper Street Fighter II and
# Vampire Savior ask 1280x768, Street Fighter III asks 1024x768; the loader's
# per-game systemprofiles fix the rest (e.g. Rastan Saga / Battle Fantasia /
# Dark Awake / EN-Eins: 1280x800 fullscreen through Wine's fullscreen hack,
# /userdata/system/rgs/emulators/windows-arcade-loader/systemprofiles/nesica/).
# We invert it. A 4:3 original runs DIRECT on the 640x480i tube: the loader's
# Wine scales its backbuffer onto the tube raster, so the picture fills the
# 4:3 glass with no bars. Only a title whose ORIGINAL canvas is 16:9 keeps
# the class canvas (1280x720 held by the loader's gamescope, output 864x486@60
# stretch pixel): the 16:9 picture is adapted to the 4:3 tube edge to edge,
# never letterboxed (this profile's FILL doctrine, header above).
# MECHANISM: the Windows arcade loader starts gamescope ITSELF (configgen
# SELF_GAMESCOPE, utils/gamescope.py:18) and its generator maps the ES
# gamescope keys into the loader profile (windowsArcadeLoaderGenerator.py
# "GAMESCOPE options"); ANY gamescope_* option set turns gamescope ON unless
# the ENABLE value is 0 — so the explicit 0 below is load-bearing: it keeps
# every direct game off that fallback while the canvas parameters stay
# inherited by the per-game enable list below (game key > system,
# Emulator.py:136,151).
nesicax.gamescope = 0
nesicax.gamescope_sharpness = 0
nesicax.gamescope_filter = pixel
nesicax.gamescope_output_resolution = 864x486
nesicax.gamescope_nested_resolution = 1280x720
nesicax.gamescope_nested_refresh = 60
nesicax.gamescope_scaler = stretch

