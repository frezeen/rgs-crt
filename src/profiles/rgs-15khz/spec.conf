[runtime]
xact.apply = WINEPREFIX="/userdata/system/rgs/emulators/windows-arcade-loader/wine-prefix/full" /userdata/system/wine/custom/GE-Proton11-10-x86_64/bin/wine reg add "HKLM\\Software\\Classes\\Wow6432Node\\CLSID\\{65d822a4-4799-42c6-9b18-d26cf66dd320}\\InProcServer32" /ve /d "C:\\windows\\syswow64\\xactengine2_10.dll" /f 2>/dev/null; WINEPREFIX="/userdata/system/rgs/emulators/windows-arcade-loader/wine-prefix/full" /userdata/system/wine/custom/GE-Proton11-10-x86_64/bin/wine reg add "HKLM\\Software\\Classes\\Wow6432Node\\CLSID\\{65d822a4-4799-42c6-9b18-d26cf66dd320}\\InProcServer32" /v ThreadingModel /d Both /f 2>/dev/null
xact.undo = WINEPREFIX="/userdata/system/rgs/emulators/windows-arcade-loader/wine-prefix/full" /userdata/system/wine/custom/GE-Proton11-10-x86_64/bin/wine reg delete "HKLM\\Software\\Classes\\Wow6432Node\\CLSID\\{65d822a4-4799-42c6-9b18-d26cf66dd320}\\InProcServer32" /f 2>/dev/null

# ── Sega Lindbergh (network shims prevent NFS lockup when title modifies NIC IP) ──
[lindbergh]
[configs]
lindbergh/ifconfig = /sbin/ifconfig
lindbergh/route = /sbin/route

# ── MAME family (GroovyMAME path) ──
[mame]
[batocera.conf]
mame.emulator = mame
mame.core = mame
mame.switchres = 1
mame.artworkcrop = 1
mame.video = accel

[configs]
mame/mame.ini = configs/mame/mame.ini
mame/default.cfg = configs/mame/default.cfg

[binaries]
mame = /usr/bin/mame/mame

# Model 2: computed 693x520i safe geometry for raw 496x384@57.52Hz arcade hardware
[model2]
[batocera.conf]
model2.videomode = 693x520i.57.524160
# sm2 emulator pin for native 1:1 render scale on CRT
model2.emulator = sm2
model2.core = sm2
model2.sm2_render_scale = 1
model2.sm2_vsync = true

[keypatch/configs/sm2-emu/sm2-emu.ini]
# Linear scaling and faithful Model 2 arcade rendering
scaling_method = bilinear
extended_draw_distance = false
crt_enabled = false
texture_filter = faithful
upscale_2d = faithful
translucency = stipple

# ── Model 3 (PCB fidelity: 57.52 refresh, upscale off) ──
[model3]
[batocera.conf]
model3.upscale_mode = 0

[moonlight]
[batocera.conf]
moonlight.gamescope = 1
moonlight.gamescope_sharpness = 0
moonlight.gamescope_filter = pixel
moonlight.gamescope_output_resolution = 640x480
moonlight.gamescope_nested_resolution = 640x480
moonlight.gamescope_nested_refresh = 60
moonlight.gamescope_scaler = stretch

# N64: parallel_n64 core dynamically tracks VI changes
[n64]
[batocera.conf]
n64.core = parallel_n64

# ── Namco / Hikaru ──
[namco2x6]
[batocera.conf]
namco2x6.play_scale = 1
namco2x6.play_filter = false
# Pin 4:3 aspect for SDTV 480p title without letterboxing
namco2x6.pcsx2_ratio = 4:3
# Raw native pixels without software bilinear blur
namco2x6.pcsx2_bilinear_filtering = 0

# ── Namco System ES3 / N2 / ES1 (WAL & linuxloader, 16:9 HD canvas -> 864x486 CRT fill, direct 4:3) ──
[namcoes3]
[batocera.conf]
# CRT 15kHz interlaced raster for Namco arcade platforms (src: dump-config)
namcoes3.videomode = 640x480i
# Disable aspect ratio bars to allow 16:9 stretch across 4:3 tube (src: dump-config)
namcoes3.keep_aspect_ratio = off
# Gamescope active for modern 16:9 HD arcade titles (src: dump-config)
namcoes3.gamescope = 1
# Integer pixel filter without artificial blur (src: dump-config)
namcoes3.gamescope_filter = pixel
# 16:9 wide canvas mapped to CRT tube height (src: dump-config)
namcoes3.gamescope_nested_resolution = 1280x720
# 60Hz arcade refresh rate (src: dump-config)
namcoes3.gamescope_nested_refresh = 60
# 864x486 CRT fill canvas for 16:9 titles (src: dump-config)
namcoes3.gamescope_output_resolution = 864x486
# Fullscreen stretch to eliminate letterboxing (src: dump-config)
namcoes3.gamescope_scaler = stretch
# Zero sharpening artifacts on CRT phosphor (src: dump-config)
namcoes3.gamescope_sharpness = 0
# Native 640x480 4:3 surface draws direct on real CRT raster without gamescope (src: dump-config)
namcoes3["Counterstrike Neo.squashfs"].gamescope = 0
# Disable aspect ratio bars to allow native 4:3 raster to fill CRT tube (src: dump-config)
namcoes3["Counterstrike Neo.squashfs"].keep_aspect_ratio = off
# 1360x768 WXGA canvas scaled to 864x486 CRT fill without cropping (src: dump-config)
namcoes3["Mario Kart Arcade GP DX (v1.18.16).squashfs"].gamescope_nested_resolution = 1360x768
# 1360x768 WXGA canvas scaled to 864x486 CRT fill without cropping (src: dump-config)
namcoes3["Maximum Heat 3D.squashfs"].gamescope_nested_resolution = 1360x768
# Native 640x480 4:3 surface draws direct on real CRT raster without gamescope (src: dump-config)
namcoes3["Wangan Midnight Maximum Tune 3.squashfs"].gamescope = 0
# Disable aspect ratio bars to allow native 4:3 raster to fill CRT tube (src: dump-config)
namcoes3["Wangan Midnight Maximum Tune 3.squashfs"].keep_aspect_ratio = off
# Native 640x480 4:3 surface draws direct on real CRT raster without gamescope (src: dump-config)
namcoes3["Wangan Midnight Maximum Tune 3DX+.squashfs"].gamescope = 0
# Disable aspect ratio bars to allow native 4:3 raster to fill CRT tube (src: dump-config)
namcoes3["Wangan Midnight Maximum Tune 3DX+.squashfs"].keep_aspect_ratio = off

