# READ FIRST: before editing this file read .opencode/skills/profiles/SKILL.md (the map: .opencode/gate-domains).
# Profile: rgs-15khz — 15 kHz CRT support inside stock RGS.
# Declarative spec: WHAT the profile sets per game; the engine owns HOW.
# Refresh is STATIC 60 (PAL systems keep the 480i modeline; model3 57.52).

label = RGS 15 kHz CRT
description = 15 kHz arcade tube support on stock RGS

# ── applied on EVERY launch ──────────────────────────────
[global]
[display]
target = crt

[batocera.conf]
# No videomode key: the ES desktop (pin auto) already lands 640x480i on
# the CRT (D0023R kernel makes the i-mode preferred; verbose-proven
# 2026-09-14 AMD R9 270X) and the stock --auto is a no-op there. The
# max-640x480 explicit changeMode was the old-box belt against a 37.5kHz
# VESA preferred — re-add per-system if a GPU ever proves that preferred.
# No interpolation on the tube: shaderset none + smooth off.
global.smooth = false
global.shaderset = none
# No bezels on the tube: the CRT is always 4:3, any stock decoration
# (e.g. global.bezel=mybezels16-9) forces a wrong first SwitchRes mode
# (16:9 BIOS) before the core geometry corrects it. Session-scoped,
# value-restored at gameStop; stock default untouched.
global.bezel = none

# Post-generate ops for the stock libretro generator (profile declares,
# engine applies after configgen wrote its files; passive otherwise).
# CRT invariant: NO shaders on the tube from ANY source — cli.drop kills
# --set-shader, .config forces cfg off (configgen clobbers pre-patches).
[libretroGenerator.py]
libretro.cli.drop = --set-shader
libretro.config = /userdata/system/configs/retroarch/retroarchcustom.cfg|video_shader_enable=false;video_shader=""
# Post-generate ops for the stock MAME generator (single section: block_of
# per NAME; explicitly prefixed — bare keys stay bare and never match).
# mame.cli.drop: stock hardcodes -sound pipewire (CLI beats ini), which would
# override our mame.ini sound part. Covers every MAME-generator launch
# (model2 moved to stock sm2 on 43.42, see [model2]); passive elsewhere.
[mameGenerator.py]
mame.cli.drop = -sound

# Post-generate ops for the stock Amiberry generator (single section, same
# prefix rule as mame). (1) RGS writes bogus default_keep_aspect; the real
# key is default_correct_aspect_ratio — forced here, mirrors the
# amiberry_keep_aspect=false lever (change both together). (2) Fill canvas
# 640x480 in the GENERATOR-managed top file (absent keys = compiled
# 720x568 defaults = pillars; the conf/ GUI file is inert for this).
[amiberryGenerator.py]
amiberry.config = /userdata/system/configs/amiberry/amiberry.conf|default_correct_aspect_ratio=false;default_width=640;default_height=480

# ── MAME family (GroovyMAME path; binary+configs scoped HERE: this block
# sets mame.emulator=mame, so these launches are the ones that execute
# /usr/bin/mame/mame — no swap when the launch never runs it, e.g. model2/sm2) ──
[mame]
[batocera.conf]
mame.emulator = mame
mame.core = mame
mame.switchres = 1
mame.artworkcrop = 1
# Explicit backend (deterministic -video accel; agrees with our ini).
mame.video = accel

# Authored CRT tuning, stable content (not user data). Key = file under
# configs/, value = target path. System-scoped: the [mame] block owns them
# (block_of), so only mame-system launches provision/swap.
[configs]
mame.ini = configs/mame/mame.ini
default.cfg = configs/mame/default.cfg
[binaries]
# Single section: block_of is per section NAME, repeats arm only the last.
# Swaps the user-procured GroovyMAME for every mame-system launch.
mame = /usr/bin/mame/mame

[model2]
[batocera.conf]
# Tube raster on the STOCK videomode-key channel (bare = preset-scaled into
# arcade_15, dotted = exact request). Declared in the COMPUTED form: MAME
# 0.289's model2 driver declares the raw 496x384@57.524160 (model2.cpp
# model2_screen() set_raw; -listxml daytona), the arcade_15 preset computes
# its safe geometry 693x520i (byte-identical modeline verified live for both
# request forms) — the key carries the raster the glass actually shows, and
# the pool name then equals what the stock setMode passes to xrandr --mode.
# sm2 has no switchres: Sm2Generator receives gameResolution and never uses
# it — gameResolution's ONLY occurrence in sm2Generator.py is that signature,
# so the tube raster IS this mode.
model2.videomode = 693x520i.57.524160
# NO emulator/core pin here on purpose: RGS chose sm2 (43.42 default) and we
# FOLLOW their choice, we never freeze it (owner doctrine 2026-09-10: stock
# leads unless we deviate for the tube; if a future pack moves the emulator,
# we re-adapt and re-certify exactly as done for 43.42). The keys below are
# sm2_* namespaced: they are simply not consumed if the emulator ever moves.
# Pack default is sm2_render_scale=4 = supersampling, i.e. fake smoothing on
# a tube (test-flow 2b forbids it): native 1:1 render on the declared mode.
model2.sm2_render_scale = 1

# ── Commodore 64 ──
[c64]
[batocera.conf]
c64.vice_zoom_mode = disabled
c64.vice_external_palette = pepto-pal
# No ratio key anywhere means configgen writes an EMPTY aspect index, which
# RA parses as 4:3 -> pillars on the 384x272 frame. squarepixel fills it.
c64.ratio = squarepixel

# ── Dreamcast family (Flycast renders 640x480 internally) ──
[dreamcast]
[batocera.conf]
dreamcast.reicast_internal_resolution = 640x480
[keypatch/configs/retroarch/config/Flycast/dreamcast.opt]
reicast_internal_resolution = "640x480"
reicast_anisotropic_filtering = "off"

[naomi]
[batocera.conf]
naomi.reicast_internal_resolution = 640x480
[keypatch/configs/retroarch/config/Flycast/naomi.opt]
reicast_internal_resolution = "640x480"
reicast_anisotropic_filtering = "off"

[naomi2]
[batocera.conf]
naomi2.reicast_internal_resolution = 640x480
[keypatch/configs/retroarch/config/Flycast/naomi2.opt]
reicast_internal_resolution = "640x480"
reicast_anisotropic_filtering = "off"

# atomiswave: RGS creates no stock .opt — this key alone (libretroOptions).
[atomiswave]
[batocera.conf]
atomiswave.reicast_internal_resolution = 640x480

# ── PlayStation 2 (PCSX2 CRT-tuned video path) ──
[ps2]
[batocera.conf]
ps2.pcsx2_vsync = 1
ps2.pcsx2_gfxbackend = 14
ps2.pcsx2_texture_filtering = 1
ps2.pcsx2_bilinear_filtering = 1
ps2.pcsx2_dithering = 1
ps2.pcsx2_fmv_ratio = 4:3
ps2.pcsx2_mipmapping = 2

# ── GameCube / Triforce / Wii (Dolphin 4:3, tuned sync) ──
[gamecube]
[batocera.conf]
gamecube.dolphin_aspect_ratio = 3
gamecube.internal_resolution = 2
gamecube.dual_core = 1
gamecube.gpu_sync = 1
gamecube.wait_for_shaders = 1
gamecube.enable_fastdisc = 1
gamecube.enable_mmu = 1

[triforce]
[batocera.conf]
triforce.dolphin_aspect_ratio = 3
triforce.internal_resolution = 2

[wii]
[batocera.conf]
wii.dolphin_aspect_ratio = 3
wii.internal_resolution = 2
wii.dual_core = 1
wii.gpu_sync = 1
wii.wait_for_shaders = 1
wii.vsync = 1

# ── Jaguar CD / Daphne / Singe ──
[daphne]
[batocera.conf]
daphne.hypseus_ratio = force_ratio

# ── Xbox / Chihiro (xemu + gamescope pixel downscale to 480i) ──
[xbox]
[batocera.conf]
xbox.gamescope = 1
xbox.gamescope_sharpness = 0
xbox.gamescope_filter = pixel
xbox.gamescope_output_resolution = 640x480
xbox.gamescope_nested_resolution = 640x480
xbox.gamescope_nested_refresh = 60
xbox.gamescope_scaler = stretch
xbox.gamescope_fullscreen = 1
xbox.xemu_render = 1

[chihiro]
[batocera.conf]
chihiro.gamescope = 1
chihiro.gamescope_sharpness = 0
chihiro.gamescope_filter = pixel
chihiro.gamescope_output_resolution = 640x480
chihiro.gamescope_nested_resolution = 640x480
chihiro.gamescope_scaler = stretch
chihiro.gamescope_fullscreen = 1
chihiro.xemu_render = 1

# ── Amiga (universal 480i: auto_crop + keep_aspect=false fills the tube) ──
[amiga1200]
[batocera.conf]
amiga1200.amiberry_scalingmethod = pixelated
amiga1200.amiberry_auto_crop = true
amiga1200.amiberry_keep_aspect = false

[amiga500]
[batocera.conf]
amiga500.amiberry_scalingmethod = pixelated
amiga500.amiberry_auto_crop = true
amiga500.amiberry_keep_aspect = false

# ── Small systems (native low modes) ──
[samcoupe]
[batocera.conf]
# Per-key live patch (stock lines archived + restored at gameStop).
[keypatch/.simcoupe/SimCoupe.cfg]
fullscreen = 1
smooth = 0
visiblearea = 0

# ── Namco / Hikaru ──
[namco2x6]
[batocera.conf]
namco2x6.play_scale = 1
namco2x6.play_filter = false

[hikaru]
[batocera.conf]
hikaru.hud_support = 0
hikaru.gamescope = 1
hikaru.gamescope_sharpness = 0
hikaru.gamescope_filter = pixel
hikaru.gamescope_output_resolution = 640x480
hikaru.gamescope_nested_resolution = 640x480
hikaru.gamescope_nested_refresh = 60
hikaru.gamescope_scaler = stretch
hikaru.gamescope_fullscreen = 1
hikaru.demulRatio = 1

# ── Model 3 (PCB fidelity: 57.52 refresh, upscale off) ──
[model3]
[batocera.conf]
model3.upscale_mode = 0

# ── Raw Thrills (gun shooters: Aliens Armageddon, Big Buck Hunter Pro) ──
[rawthrills]
[batocera.conf]
# Tube raster on the STOCK videomode-key channel (bare = preset-scaled into
# arcade_15, dotted = exact request). The key is consumed by STOCK configgen
# (Emulator.py video_mode -> Generator.getResolutionMode -> emulatorlauncher
# changeMode), NOT by the loader: linuxloader writes WIDTH/HEIGHT from
# gameResolution into its generated ini and scales dynamically to whatever
# raster it receives. So this key IS the whole lever; nothing else to set.
# MEASURED on the glass 2026-10-07, both engines, window 640x480 at (0,0) on
# the 640x480i tube: the picture FILLS the 4:3 frame, no letterbox and no
# stretch (Big Buck Hunter Pro is 4:3 natively, its wine ini asks 1280x960),
# so no dotted raster is needed.
# RGS per-game keys in its own zone (`rawthrills["<rom>"].videomode=…`) take
# precedence over this global one (game > system > global) and do NOT need
# porting here: a `max-*` request is resolved against the tube's mode pool,
# which holds only 640x480i and 320x240 on this cab, so it can only land
# 640x480 -> 640x480i; per-game `gamescope` is nested inside the mode change
# and cannot escape the raster either. Latent, NOT built (neither ROM is on
# disk): the `Aliens Armageddon.wsquashfs`/`(demul)` variants set
# virtual_desktop=1, whose wine desktop size comes from the resolved
# videomode — this value carries the `i`, which wine's
# `explorer /desktop=Wine,WxH` parser may reject; if those ROMs ever land
# they may need a per-game videomode without the `i`.
# NO emulator/core pin here on purpose: RGS chose the engines (wine default,
# linuxloader pinned per-game for Aliens) and we FOLLOW their choice, we
# never freeze it (same doctrine as [model2]).
rawthrills.videomode = 640x480i

# ── Misc single-screen systems ──
[commanderx16]
[batocera.conf]
commanderx16.x16emu_scale = 1

# ── PSP (nearest: bilinear blurs on CRT) ──
[psp]
[batocera.conf]
psp.vsync = true
psp.texture_filtering = 0
psp.gfxbackend = 3 (VULKAN)
psp.internal_resolution = 1
# DisplayStretch must sit inside [Graphics] (the stock generator never
# writes it); the section-aware keypatch places it there.
[keypatch/configs/ppsspp/PSP/SYSTEM/ppsspp.ini]
Graphics/DisplayStretch = True

# ── Modern systems downscaled to 15kHz (native HD render, SD output +
# gamescope pixel filter: readable/playable, NOT pixel-perfect) ──
# 3ds (azahar): the stock Default layout stacks the two screens equal at
# 400x480 (portrait) inside the 640x480 tube — measured 2026-10-07: 120px
# pillars per side, 62% fill. Azahar cannot stretch the pair to the window
# (aspect_ratio is Default-only on desktop, framebuffer_layout.cpp:144, and
# is not read from the ini), so the fill comes from azahar's OWN Custom
# Layout: explicit rects 640x240 each stacked = a 640x480 canvas = the tube,
# equal-size screens, zero bars. layout_option rides batocera.conf
# (configgen manages it and would clobber a keypatch).
# QSettings convention: azahar writes a sibling "<key>\default" flag per key
# and ReadBasicSetting IGNORES the value while that flag is true — azahar
# saves its own defaults, so value-only patches are discarded (measured:
# our rects landed, azahar rendered the default 800x480 canvas). Each key
# therefore also clears its own "\default", exactly as configgen does.
[3ds]
[batocera.conf]
3ds.azahar_screen_layout = 6-false
[keypatch/configs/azahar-emu/qt-config.ini]
Layout/custom_top_x = 0
Layout/custom_top_x\default = false
Layout/custom_top_y = 0
Layout/custom_top_y\default = false
Layout/custom_top_width = 640
Layout/custom_top_width\default = false
Layout/custom_top_height = 240
Layout/custom_top_height\default = false
Layout/custom_bottom_x = 0
Layout/custom_bottom_x\default = false
Layout/custom_bottom_y = 240
Layout/custom_bottom_y\default = false
Layout/custom_bottom_width = 640
Layout/custom_bottom_width\default = false
Layout/custom_bottom_height = 240
Layout/custom_bottom_height\default = false

# switch / xbox360 / ps3 / wiiu / psvita / ps4: 16:9 content — wide 864x486
# fills the 4:3 tube without letterbox.
[switch]
[batocera.conf]
switch.gamescope = 1
switch.gamescope_sharpness = 0
switch.gamescope_filter = pixel
switch.gamescope_output_resolution = 864x486
switch.gamescope_nested_resolution = 864x486
switch.gamescope_nested_refresh = 60
switch.gamescope_scaler = stretch
switch.gamescope_fullscreen = 1

# xbox360 (xenia): native Vulkan backend (D3D12 default broken on Maxwell).
[xbox360]
[batocera.conf]
xbox360.xenia_api = Vulkan
xbox360.gamescope = 1
xbox360.gamescope_sharpness = 0
xbox360.gamescope_filter = pixel
xbox360.gamescope_output_resolution = 864x486
xbox360.gamescope_nested_resolution = 864x486
xbox360.gamescope_nested_refresh = 60
xbox360.gamescope_scaler = stretch
xbox360.gamescope_fullscreen = 1

# ps3 (rpcs3): rpcs3_ratio=16:9 fills (else 4:3 letterbox); Bilinear for the
# non-integer downscale (Nearest breaks text); Ultra shader precision;
# scale 100.
[ps3]
[batocera.conf]
ps3.rpcs3_ratio = 16:9
ps3.rpcs3_resolution_scale = 100
ps3.rpcs3_scaling = Bilinear
ps3.rpcs3_vsync = True
ps3.rpcs3_shader = Ultra
ps3.gamescope = 1
ps3.gamescope_sharpness = 0
ps3.gamescope_filter = pixel
ps3.gamescope_output_resolution = 864x486
ps3.gamescope_nested_resolution = 864x486
ps3.gamescope_nested_refresh = 60
ps3.gamescope_scaler = stretch
ps3.gamescope_fullscreen = 1

# wiiu (cemu): cemu_aspect=1 Stretch (aspect 0 letterboxes).
[wiiu]
[batocera.conf]
wiiu.cemu_aspect = 1
wiiu.gamescope = 1
wiiu.gamescope_sharpness = 0
wiiu.gamescope_filter = pixel
wiiu.gamescope_output_resolution = 864x486
wiiu.gamescope_nested_resolution = 864x486
wiiu.gamescope_nested_refresh = 60
wiiu.gamescope_scaler = stretch
wiiu.gamescope_fullscreen = 1

# psvita (vita3k): native 960x544 exceeds tube bandwidth at 60Hz
