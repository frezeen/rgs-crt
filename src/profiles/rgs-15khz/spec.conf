xact.undo = WINEPREFIX="/userdata/system/rgs/emulators/windows-arcade-loader/wine-prefix/full" /userdata/system/wine/custom/GE-Proton11-10-x86_64/bin/wine reg delete "HKLM\\Software\\Classes\\Wow6432Node\\CLSID\\{65d822a4-4799-42c6-9b18-d26cf66dd320}\\InProcServer32" /f 2>/dev/null

