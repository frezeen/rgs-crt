# Ensure stock DejaVuSansMono font is present in user share dir (src: dump-config)
openmsx.ensure = /usr/share/openmsx/skins/DejaVuSansMono.ttf.gz|/userdata/system/configs/openmsx/share/skins/DejaVuSansMono.ttf.gz

# ── pcsx2 ────────────────────────────────────────────────────────────────────
[ps2]
[batocera.conf]
# CRT profile setting (pcsx2_bilinear_filtering=1) (src: dump-config)
ps2.pcsx2_bilinear_filtering = 1
# CRT profile setting (pcsx2_dithering=1) (src: dump-config)
ps2.pcsx2_dithering = 1
# CRT profile setting (pcsx2_fmv_ratio=4:3) (src: dump-config)
ps2.pcsx2_fmv_ratio = 4:3
# CRT profile setting (pcsx2_gfxbackend=14) (src: dump-config)
ps2.pcsx2_gfxbackend = 14
