# configgen's own changeMode carries the raster — no competing modeset.
pyxel.videomode = 256x256

# ── libretro (RetroArch) — CRT SwitchRes keys, every RA system ──
# Per-key live patch (stock lines archived + restored).
# crt_switch_resolution: 4 = INI — the official script's choice
# ("RETROARCH — CRT SWITCHRES VIA switchres.ini (MODE 4)"), NOT 1 = 15KHz.
# crt_switch_resolution_super: 1920 = a CEILING, not a fixed width: RA's
# engine combines it with the measured dotclock floor (written into the
# config-dir switchres.ini) and picks the smallest width in that range, so
# a chain that clocks the native modes stays native (AMD: floor 4.5) while
# one that cannot gets the smallest widened raster (Intel VGA: floor 11.1
# -> 640 wide). Owner directive 2026-09-20: these keys enter ONLY with
# this profile (keypatch, applied at gameStart and restored at gameStop) —
# batocera.conf stays stock RGS.
[emulator.libretro]
[keypatch/configs/retroarch/retroarchcustom.cfg]
crt_switch_resolution = "4"
crt_switch_resolution_super = "1920"

# ── Game Boy Advance (sub-15kHz content 240x160@60 = 9.6kHz: no native
# mode; RA dynamic-picks the 720x480i container, even 3x). ratio=core:
# mgba 3:2 DAR = full frame, zero pillars (4:3 double-squeezes).
[gba]
[batocera.conf]
gba.ratio = core

# n64: CRT-scoped core choice (session key, restored at gameStop).
# parallel_n64 reports VI dynamically (menu↔game live switching);
# stock mupen reports once at boot. Stock global default untouched.
[n64]
[batocera.conf]
n64.core = parallel_n64