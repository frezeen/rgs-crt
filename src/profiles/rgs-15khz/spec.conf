# READ FIRST: before editing this file read docs/writing-profiles.md (the user manual for profiles).
# Profile: rgs-15khz — 15 kHz CRT support inside stock RGS.
# Declarative spec: WHAT the profile sets per game; the engine owns HOW.
# Refresh is STATIC 60 (PAL systems keep the 480i modeline; model3 57.52).
#
# ── Display identity: this profile FILLS the tube — stretch, never bars ──
# rgs-15khz has ALWAYS stretched a 16:9 game canvas onto the 4:3 tube: the
# picture fills the screen edge to edge and black bars are eliminated. That
# is deliberate. The cost is a mild aspect error on 16:9 content — and a
# heavy one on a PORTRAIT or ultra-wide canvas (e.g. RGS's 700x1080 Disney
# Crossy Road, which RGS itself shows pillarboxed on the LCD). Every 16:9
# class here therefore carries `gamescope_scaler = stretch`; gamescope's
# default (`auto` = fit) is deliberately NOT used, because it letterboxes.
# Measured A/B on the tube 2026-10-11: `stretch` fills (Candy Crush 640x480,
# aspect 1.334); `auto` letterboxes it (640x360, 60px bars top and bottom).
# A THIRD profile is planned — also CRT, also 15 kHz, same raster — that
# PRESERVES the source aspect and shows the bars (`gamescope_scaler = fit`).
# This profile stays the FILL one: do not "fix" the aspect here, preserving
# it is that future profile's job, not a defect of this one.

label = RGS 15 kHz CRT
description = 15 kHz arcade tube support on stock RGS

# ── applied on EVERY launch ──────────────────────────────
[global]
[display]
target = crt

[batocera.conf]
# No videomode key: the ES desktop (pin auto) already lands 640x480i on
# the CRT (D0023R kernel makes the i-mode preferred; verbose-proven
# 2026-09-14 AMD R9 270X) and the stock --auto is a no-op there. The
# max-640x480 explicit changeMode was the old-box belt against a 37.5kHz
# VESA preferred — re-add per-system if a GPU ever proves that preferred.
# No interpolation on the tube: shaderset none + smooth off.
global.smooth = false
global.shaderset = none
# No bezels on the tube: the CRT is always 4:3, any stock decoration
# (e.g. global.bezel=mybezels16-9) forces a wrong first SwitchRes mode
# (16:9 BIOS) before the core geometry corrects it. Session-scoped,
# value-restored at gameStop; stock default untouched.
global.bezel = none

# Post-generate ops for the stock libretro generator (profile declares,
# engine applies after configgen wrote its files; passive otherwise).
# CRT invariant: NO shaders on the tube from ANY source — cli.drop kills
# --set-shader, .config forces cfg off (configgen clobbers pre-patches).
[libretroGenerator.py]
libretro.cli.drop = --set-shader
libretro.config = /userdata/system/configs/retroarch/retroarchcustom.cfg|video_shader_enable=false;video_shader=""
# Post-generate ops for the stock MAME generator (single section: block_of
# per NAME; explicitly prefixed — bare keys stay bare and never match).
# mame.cli.drop: stock hardcodes -sound pipewire (CLI beats ini), which would
# override our mame.ini sound part. Covers every MAME-generator launch
# (model2 moved to stock sm2 on 43.42, see [model2]); passive elsewhere.
[mameGenerator.py]
mame.cli.drop = -sound

# Post-generate ops for the stock Amiberry generator (single section, same
# prefix rule as mame). (1) RGS writes bogus default_keep_aspect; the real
# key is default_correct_aspect_ratio — forced here, mirrors the
# amiberry_keep_aspect=false lever (change both together). (2) Fill canvas
# 640x480 in the GENERATOR-managed top file (absent keys = compiled
# 720x568 defaults = pillars; the conf/ GUI file is inert for this).
[amiberryGenerator.py]
amiberry.config = /userdata/system/configs/amiberry/amiberry.conf|default_correct_aspect_ratio=false;default_width=640;default_height=480

# Post-generate ops for hypseus (daphne / singe).
# Daphne ROMs ship per-game .commands files hardcoding -x 1920 -y 1080, which
# configgen appends at the end of the CLI, overriding the 640x480 raster and
# causing a 3x zoomed/cropped viewport. Dropping -x/-y and appending 640x480
# restores 1:1 tube rendering.
[hypseusSingeGenerator.py]
hypseus_singe.cli.drop = -x -y
hypseus_singe.cli.append = -x 640 -y 480

# Post-generate ops for the stock openMSX generator. The tube IS the filter,
# so the stock CRT emulation (scanline/blur/glow) stays off — forced in the
# settings file openMSX reads at startup, which is the robust home for it.
# ensure repairs the user data tree, which the generator copies once and
# never refreshes, so the font skins the current package ships are missing
# from it (the OSD then cannot draw and warns on every launch). It copies a
# missing stock file into the user tree once; that is a repair, not a
# session change, so it is not undone at gameStop (DSL.md op table).
[emulator.openmsx]
[openmsxGenerator.py]
openmsx.config.xml = /userdata/system/configs/openmsx/share/settings.xml|blur=0;scanline=0;glow=0
openmsx.ensure = /usr/share/openmsx/skins/DejaVuSans.ttf.gz|/userdata/system/configs/openmsx/share/skins/DejaVuSans.ttf.gz
openmsx.ensure = /usr/share/openmsx/skins/DejaVuSansMono.ttf.gz|/userdata/system/configs/openmsx/share/skins/DejaVuSansMono.ttf.gz

# ── RGS utility menu (+rgs) ──
# The stock RGS utilities (the upgrade tool rgs_upgrade.sh and its siblings)
# are launched like pseudo-games; their xterms hardcode `-fs 16`, a size
# chosen for a 1080p LCD and roughly twice too large on the 480i tube. This
# block declares the per-launch font size and prepends the engine's session
# xterm wrapper (a runtime tool, NOT a stock binary) so the bare `xterm` the
# utility calls gets its `-fs` rewritten. Both entries land IN-PROCESS (the
# gameStart hook is a subprocess — its env never reaches the game; see the
# [runtime] contract) and are scoped to this launch, so no stock RGS file is
# touched and nothing becomes global. TUBE VALUE: 10pt — the menu's xterm
# opens at this size (the stock 16 is sized for a 1080p LCD and about twice
# too large at 480i); it is the one knob here.
# BLOCK NAME = THE SYSTEM ID, VERBATIM: a block matches a launch when
# `_block_matches` finds block == system (merge.py:1218), and the ES system
# this menu lives in is `+rgs`, NOT `rgs` (measured: the stock
# /userdata/system/configs/emulationstation/es_systems_rgs.cfg:6 <name>+rgs
# </name>, path /userdata/roms/rgs, ext .sh). Written as `[rgs]` the whole
# block matched nothing and the declaration below was a measured SILENT
# NO-OP — the font never changed on the owner's box.
[+rgs]
[runtime]
env = RGS_CRT_XTERM_FS=10
path.prepend = /userdata/system/crt-dual/src/runtime/bin

# ── MAME family (GroovyMAME path; binary+configs scoped HERE: this block
# sets mame.emulator=mame, so these launches are the ones that execute
# /usr/bin/mame/mame — no swap when the launch never runs it, e.g. model2/sm2) ──
[mame]
[batocera.conf]
mame.emulator = mame
mame.core = mame
mame.switchres = 1
mame.artworkcrop = 1
# Explicit backend (deterministic -video accel; agrees with our ini).
mame.video = accel

# Authored CRT tuning, stable content (not user data). Key = file under
# configs/, value = target path. System-scoped: the [mame] block owns them
# (block_of), so only mame-system launches provision/swap.
[configs]
mame/mame.ini = configs/mame/mame.ini
mame/default.cfg = configs/mame/default.cfg
[binaries]
# Single section: block_of is per section NAME, repeats arm only the last.
# Swaps the user-procured GroovyMAME for every mame-system launch.
mame = /usr/bin/mame/mame

[model2]
[batocera.conf]
# Tube raster on the STOCK videomode-key channel (bare = preset-scaled into
# arcade_15, dotted = exact request). Declared in the COMPUTED form: MAME
# 0.289's model2 driver declares the raw 496x384@57.524160 (model2.cpp
# model2_screen() set_raw; -listxml daytona), the arcade_15 preset computes
# its safe geometry 693x520i (byte-identical modeline verified live for both
# request forms) — the key carries the raster the glass actually shows, and
# the pool name then equals what the stock setMode passes to xrandr --mode.
# sm2 has no switchres: the tube raster IS this mode, and sm2-emu opens
# FULLSCREEN on it (measured 2026-10-20: window 693x520 at 0,0, one window,
# cropdetect 688x512 -> full-bleed). The current RGS generator does NOT
# manage window_width/height (its merge leaves them untouched), so there is
# nothing to declare there.
model2.videomode = 693x520i.57.524160
# PIN: the emulator this system runs. RGS's pack pins sm2 (their
# batocera.conf line 1027) but their own later line 1462 pins
# libretro/mame, and their es_systems command passes -emulator %EMULATOR%
# to configgen, which gives the ARGUMENT priority over the conf
# (configgen/Emulator.py:198-202): on a fresh install sm2 never runs and
# their whole sm2 block (vulkan, guns, xinput, FFB, wheel) is inert.
# Measured 2026-10-20 against the 43.68 update archive (our conf zone is
# byte-identical to theirs). We deviate for the tube: the native render
# (sm2_render_scale below) exists only on the sm2 path — on libretro/mame
# a 496x384 game is scaled, not integer, onto the raster.
model2.emulator = sm2
model2.core = sm2
# The keys below are sm2_* namespaced: they are simply not consumed if the
# emulator ever moves.
# Pack default is sm2_render_scale=4 = supersampling, i.e. fake smoothing on
# a tube (test-flow 2b forbids it): native 1:1 render on the declared mode.
model2.sm2_render_scale = 1
# VSYNC like the original: the arcade monitor ran the board's own
# 57.5245 Hz, so the picture was locked to the display and could not tear.
# sm2-emu ships vsync=false (the frame is presented as soon as it is ready):
# on our interlaced 57.52 Hz raster that is a tear line every ~3.7 min of
# clock drift (57.5245 vs 57.52). The generator honours sm2_vsync.
model2.sm2_vsync = true
[keypatch/configs/sm2-emu/sm2-emu.ini]
# The finished frame scaled to the window the way the ARCADE MONITOR did: a
# continuous beam, i.e. linear. sm2-emu ships "sharp" (sharp-bilinear), a
# video-player aesthetic that sharpens what a 15 kHz tube cannot resolve
# (each source pixel covers ~2.5 px on the glass) into ringing and shimmer.
# The generator does not manage this key (its merge leaves it alone), so the
# profile owns it here; the engine restores the previous value at gameStop.
scaling_method = bilinear
# Pure arcade fidelity: disable modern distance enhancements, 2D smoothing,
# software CRT shaders (on real CRT) and keep exact Model 2 hardware rendering.
extended_draw_distance = false
crt_enabled = false
texture_filter = faithful
upscale_2d = faithful
translucency = stipple

# ── Commodore 64 ──
[c64]
[batocera.conf]
c64.vice_zoom_mode = disabled
c64.vice_external_palette = pepto-pal
# No ratio key anywhere means configgen writes an EMPTY aspect index, which
# RA parses as 4:3 -> pillars on the 384x272 frame. squarepixel fills it.
c64.ratio = squarepixel

# ── Dreamcast family (Flycast renders 640x480 internally) ──
[dreamcast]
[batocera.conf]
dreamcast.reicast_internal_resolution = 640x480
[keypatch/configs/retroarch/config/Flycast/dreamcast.opt]
reicast_internal_resolution = "640x480"
reicast_anisotropic_filtering = "off"

[naomi]
[batocera.conf]
naomi.reicast_internal_resolution = 640x480
[keypatch/configs/retroarch/config/Flycast/naomi.opt]
reicast_internal_resolution = "640x480"
reicast_anisotropic_filtering = "off"

[naomi2]
[batocera.conf]
naomi2.reicast_internal_resolution = 640x480
[keypatch/configs/retroarch/config/Flycast/naomi2.opt]
reicast_internal_resolution = "640x480"
reicast_anisotropic_filtering = "off"

# atomiswave: RGS creates no stock .opt — this key alone (libretroOptions).
[atomiswave]
[batocera.conf]
atomiswave.reicast_internal_resolution = 640x480

# ── PlayStation 2 (PCSX2 CRT-tuned video path) ──
[ps2]
[batocera.conf]
ps2.pcsx2_vsync = 1
ps2.pcsx2_gfxbackend = 14
ps2.pcsx2_texture_filtering = 1
ps2.pcsx2_bilinear_filtering = 1
ps2.pcsx2_dithering = 1
ps2.pcsx2_fmv_ratio = 4:3
ps2.pcsx2_mipmapping = 2

# ── GameCube / Triforce / Wii (Dolphin 4:3, tuned sync) ──
[gamecube]
[batocera.conf]
gamecube.dolphin_aspect_ratio = 3
gamecube.internal_resolution = 2
gamecube.dual_core = 1
gamecube.gpu_sync = 1
gamecube.wait_for_shaders = 1
gamecube.enable_fastdisc = 1
gamecube.enable_mmu = 1

[triforce]
[batocera.conf]
triforce.dolphin_aspect_ratio = 3
triforce.internal_resolution = 2

[wii]
[batocera.conf]
wii.dolphin_aspect_ratio = 3
wii.internal_resolution = 2
wii.dual_core = 1
wii.gpu_sync = 1
wii.wait_for_shaders = 1
wii.vsync = 1

# ── Jaguar CD / Daphne / Singe ──
[daphne]
[batocera.conf]
daphne.hypseus_ratio = force_ratio

# ── Xbox / Chihiro (xemu/xemuchihiro + gamescope pixel downscale to 480i) ──
# gamescope is applied by emulatorlauncher (set_gamescope_cmd), not by the
# generator, so these keys keep working on both systems.
[xbox]
[batocera.conf]
xbox.gamescope = 1
xbox.gamescope_sharpness = 0
xbox.gamescope_filter = pixel
xbox.gamescope_output_resolution = 640x480
xbox.gamescope_nested_resolution = 640x480
xbox.gamescope_nested_refresh = 60
xbox.gamescope_scaler = stretch
xbox.xemu_render = 1

[chihiro]
[batocera.conf]
# Pin to the dedicated v44 backport generator
chihiro.emulator = xemuchihiro
chihiro.core = xemuchihiro
# Native 640x480 rendering with Vulkan (RADV): xemu-chihiro renders 640x480
# native (surface_scale=1). OpenGL on RadeonSI/Pitcairn causes an AMDGPU ring gfx
# timeout and GPU reset (xemu-project/xemu#1656), so Vulkan is selected.
chihiro.xemu_chihiro_api = VULKAN
chihiro.gamescope = 0
chihiro.xemu_chihiro_render = 1
chihiro.xemu_chihiro_scaling = scale
chihiro.xemu_chihiro_aspect = auto
chihiro.xemu_chihiro_vsync = true
chihiro.xemu_chihiro_gamma = 1.0

# ── Amiga (universal 480i: auto_crop + keep_aspect=false fills the tube) ──
[amiga1200]
[batocera.conf]
amiga1200.amiberry_scalingmethod = pixelated
amiga1200.amiberry_auto_crop = true
amiga1200.amiberry_keep_aspect = false

[amiga500]
[batocera.conf]
amiga500.amiberry_scalingmethod = pixelated
amiga500.amiberry_auto_crop = true
amiga500.amiberry_keep_aspect = false

# New stock system in 43.67 (RGS zone ships keep_aspect=True): same treatment
# as its 500/1200 siblings, so it fills the tube instead of pillar-boxing.
[amiga_ransom]
[batocera.conf]
amiga_ransom.amiberry_scalingmethod = pixelated
amiga_ransom.amiberry_auto_crop = true
amiga_ransom.amiberry_keep_aspect = false

# ── Small systems (native low modes) ──
[samcoupe]
[batocera.conf]
# Per-key live patch (stock lines archived + restored at gameStop).
[keypatch/.simcoupe/SimCoupe.cfg]
fullscreen = 1
smooth = 0
visiblearea = 0
# Native 4:3 pixels (stock TV-aspect is ~5:3 → bands on the tube) and no
# emulator OSD (speed readout, drive lights, status messages) on the tube.
tvaspect = 0
profile = 0
status = 0
drivelights = 0

# ── Namco / Hikaru ──
[namco2x6]
[batocera.conf]
namco2x6.play_scale = 1
namco2x6.play_filter = false
# PCSX2's default Auto (4:3 interlaced / 3:2 progressive) frames this 480p
# arcade title at 3:2 -> bars on a 4:3 tube. The game is a 4:3 cab (SDTV 480p),
# so pin the true aspect: full tube, no bars, no stretch.
namco2x6.pcsx2_ratio = 4:3
# Disable bilinear present filter (linear_present_mode = 0, "None"): raw native
# pixels on CRT, leaving physical beam rasterization without artificial software blur.
namco2x6.pcsx2_bilinear_filtering = 0

[hikaru]
[batocera.conf]
hikaru.gamescope = 1
hikaru.gamescope_sharpness = 0
hikaru.gamescope_filter = pixel
hikaru.gamescope_output_resolution = 640x480
hikaru.gamescope_nested_resolution = 640x480
hikaru.gamescope_nested_refresh = 60
hikaru.gamescope_scaler = stretch
hikaru.demulRatio = 1

# ── Model 3 (PCB fidelity: 57.52 refresh, upscale off) ──
[model3]
[batocera.conf]
model3.upscale_mode = 0

# ── Raw Thrills (gun shooters: Aliens Armageddon, Big Buck Hunter Pro) ──
[rawthrills]
[batocera.conf]
# Tube raster on the STOCK videomode-key channel (bare = preset-scaled into
# arcade_15, dotted = exact request). The key is consumed by STOCK configgen
# (Emulator.py video_mode -> Generator.getResolutionMode -> emulatorlauncher
# changeMode), NOT by the loader: linuxloader writes WIDTH/HEIGHT from
# gameResolution into its generated ini and scales dynamically to whatever
# raster it receives. So this key IS the whole lever; nothing else to set.
# MEASURED on the glass 2026-10-07, both engines, window 640x480 at (0,0) on
# the 640x480i tube: the picture FILLS the 4:3 frame, no letterbox and no
# stretch (Big Buck Hunter Pro is 4:3 natively, its wine ini asks 1280x960),
# so no dotted raster is needed.
# RGS per-game keys in its own zone (`rawthrills["<rom>"].videomode=…`) take
# precedence over this global one (game > system > global) and do NOT need
# porting here: a `max-*` request is resolved against the tube's mode pool,
# which holds only 640x480i and 320x240 on this cab, so it can only land
# 640x480 -> 640x480i; per-game `gamescope` is nested inside the mode change
# and cannot escape the raster either. Latent, NOT built (neither ROM is on
# disk): the `Aliens Armageddon.wsquashfs`/`(demul)` variants set
# virtual_desktop=1, whose wine desktop size comes from the resolved
# videomode — this value carries the `i`, which wine's
# `explorer /desktop=Wine,WxH` parser may reject; if those ROMs ever land
# they may need a per-game videomode without the `i`.
# NO emulator/core pin here on purpose: RGS chose the engines (wine default,
# linuxloader pinned per-game for Aliens) and we FOLLOW their choice, we
# never freeze it (same doctrine as [model2]).
rawthrills.videomode = 640x480i

# ── Windows arcade under wine (ONE class: Raw Thrills [TESTED anchor] +
#    Adrenaline / Arcade PC / UNIS) ──
# Raw Thrills, Adrenaline, Arcade PC and UNIS are the SAME category: RGS
# Windows-arcade systems whose games are Windows trees run under wine, each
# carrying an RGS-shipped `<system>.videomode=max-*` in its tuning zone.
# Each system still needs its OWN block (the DSL `[<id>]` matches one system
# ID), but the lever is one and the same — this comment owns the class and
# [rawthrills] above is its measured anchor. The typex/typex2/nesicax/
# nesicax2 family, globalvr, seganu and konamipc ride the SAME pipeline and
# carry the same class block below; their content is not on the certification
# box yet, so their rows stay pending until a tube launch (DECLARED DEBT —
# coherent with the certified siblings, not individually measured). gaelco is
# EXCLUDED on purpose: it is libretro(mame)-default, not a wine system, and a
# gamescope wrapper would take over its own CRT SwitchRes path. Windows games
# run under wine
# (stock WineGenerator -> batocera-wine; RGS pins <system>.emulator=wine in
# its own zone, we FOLLOW their choice, no emulator/core pin here). The tube
# raster is the STOCK videomode-key channel, consumed by STOCK configgen
# (Emulator.py video_mode -> Generator.getResolutionMode ->
# emulatorlauncher changeMode); wine takes the resolved mode as its desktop
# (batocera-wine reads the videomode for its virtual desktop when a ROM asks
# for one). RGS ships `max-1920x1080` for each of them; on a CRT-only cab the
# mode pool holds only 640x480i and 320x240, so a `max-*` request can only
# land the tube mode — but the explicit value is deterministic and does not
# depend on whether the LCD is still enabled when configgen resolves it
# (measured on the rawthrills class 2026-10-07: 640x480 window fills the 4:3
# frame, no letterbox, no stretch). Per-game keys RGS ships in its own zone
# (`arcadepc["<rom>"].videomode=…`, game > system) take precedence and are
# NOT ported here: a `max-*` request is resolved against the tube's pool, so
# it can only land the tube mode. See docs/emulators-status.md.
[adrenaline]
[batocera.conf]
adrenaline.videomode = 640x480i
# Candy Crush Arcade is Unity + a ReShade/ArcCabView bezel that renders its
# 16:9 picture at 1920x1080; on the tube's 640x480i it is visible for a
# moment and then goes BLACK (measured 2026-10-11; the same game runs on the
# LCD at 1920x1080). The tube needs the HD-console treatment: gamescope holds
# the game on an HD canvas and stretches the 16:9 frame onto the 4:3 tube
# (pixel filter, no CRT-emulation effects) — the same policy as the
# ps3/xbox360/wiiu blocks. output 864x486 is the established 16:9 fill.
# CANVAS = 1280x720 for the WHOLE Windows-arcade class (owner decision
# 2026-10-18): the canvas is what the GPU pays for. Measured with this same
# class treatment (PinballFX-Win64, R7 370): GPU-busy 99.7% on a 1080p canvas
# vs 47.5% on 720p — identical 640x480i output, identical picture on the tube
# except the very finest print (A/B in /tmp/rgs-crt-evidence/). The rule this
# encodes is test-flow.md step 2c LOAD. The no-content systems below inherit
# the class value verbatim; each re-checks its own LOAD when content lands.
adrenaline.gamescope = 1
adrenaline.gamescope_sharpness = 0
adrenaline.gamescope_filter = pixel
adrenaline.gamescope_output_resolution = 864x486
adrenaline.gamescope_nested_resolution = 1280x720
adrenaline.gamescope_nested_refresh = 60
adrenaline.gamescope_scaler = stretch

[arcadepc]
[batocera.conf]
arcadepc.videomode = 640x480i
# INVERSION OF RGS's LCD ADAPTATION FOR ARCADE PC (same doctrine as nesicax and typex):
# 4:3 titles (Arctic Thunder, Hydro Thunder, Offroad Thunder, Savage Quest,
# Police Trainer 2, The Act, Sega Rally 2 [4-3], Ballistics,
# Bug Busters, SpongeBob Bowling, Subway Surfers, Tatsunoko vs Capcom, etc.) run
# DIRECT on the 640x480i tube without Gamescope (gamescope = 0): native 1:1
# pixels, 100% full-bleed 4:3 fill, zero GPU compositor overhead.
# Only 16:9 widescreen arcade titles keep the class canvas (1280x720 held by
# Gamescope, stretched to the 4:3 tube without letterbox bars).
arcadepc.gamescope = 0
arcadepc.gamescope_sharpness = 0
arcadepc.gamescope_filter = pixel
arcadepc.gamescope_output_resolution = 864x486
arcadepc.gamescope_nested_resolution = 1280x720
arcadepc.gamescope_nested_refresh = 60
arcadepc.gamescope_scaler = stretch

# ── The 16:9-native titles: class canvas, adapted to the 4:3 tube ──
arcadepc["DCOP (demul).wsquashfs"].gamescope = 1
arcadepc["Extreme Off Road.wsquashfs"].gamescope = 1
arcadepc["Family Guy Bowling Arcade.wsquashfs"].gamescope = 1
arcadepc["Family Guy Bowling Arcade.wsquashfs"].gamescope_nested_resolution = 1920x1080
arcadepc["Family Guy Bowling Arcade.wsquashfs"].gamescope_output_resolution = 640x480
arcadepc["Fire Hero Arcade (demul).wsquashfs"].gamescope = 1
arcadepc["Friction (demul).wsquashfs"].gamescope = 1
arcadepc["Friction (demul).wsquashfs"].gamescope_nested_resolution = 1920x1080
arcadepc["Hotshots Fire Rescue (demul).wsquashfs"].gamescope = 1
arcadepc["Mad Bullets.wsquashfs"].gamescope = 1
arcadepc["Mars Sortie (demul).wsquashfs"].gamescope = 1
arcadepc["Mech Dinosaur (demul).wsquashfs"].gamescope = 1
arcadepc["Mech Tornado (demul).wsquashfs"].gamescope = 1
arcadepc["Plants vs Zombies The Last Stand.wsquashfs"].gamescope = 1
arcadepc["Pop Moto.wsquashfs"].gamescope = 1
arcadepc["Robin Hood.wsquashfs"].gamescope = 1
