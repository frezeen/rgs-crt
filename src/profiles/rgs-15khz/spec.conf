# READ FIRST: before editing this file read docs/writing-profiles.md (the user manual for profiles).
# Profile: rgs-15khz — 15 kHz CRT support inside stock RGS.
# Declarative spec: WHAT the profile sets per game; the engine owns HOW.
# Refresh is STATIC 60 (PAL systems keep the 480i modeline; model3 57.52).
#
# ── Display identity: this profile FILLS the tube — stretch, never bars ──
# A 16:9 game canvas is stretched onto the 4:3 tube: the picture fills the
# screen edge to edge and no bar is kept. Every 16:9 class here therefore
# carries `gamescope_scaler = stretch`; gamescope's default (`auto`, i.e.
# fit) is deliberately not used because it letterboxes. The price is a mild
# aspect error on 16:9 content and a heavy one on a portrait or ultra-wide
# canvas; preserving the source aspect is a different profile's job, not a
# defect of this one — do not "fix" the aspect here.

label = RGS 15 kHz CRT
description = 15 kHz arcade tube support on stock RGS

# ── Global (applied on EVERY launch) ─────────────────────────────────────────
[global]
[display]
target = crt
[batocera.conf]
# Disable 16:9 stock bezels globally on 4:3 CRT (src: configgen)
global.bezel = none
# Disable stock shaders globally on real 15kHz CRT (src: configgen)
global.shaderset = none
# Global CRT video baseline: no shaders, no interpolation, no bezels (src: dump-config)
global.smooth = false
[runtime]
# The stock launcher returns on the game's pipe EOF, but gamescope's reaper and the wine services inherit those pipes and outlive the game: detach the game's stdio so the launcher returns with its direct child (src: configgen)
env = RGS_STDIO_DETACH=1
# The host cursor arrow stays off the glass on every launch; mouse and lightgun input untouched (src: configgen)
cursor_hide.apply = batocera-mouse hide
# ES gets its arrow back at gameStop (src: configgen)
cursor_hide.undo = batocera-mouse show

# ── amiberry ─────────────────────────────────────────────────────────────────
[emulator.amiberry]
[batocera.conf]
# Amiberry 4:3 CRT framing option (amiberry_auto_crop=true) (src: configgen)
amiberry_auto_crop = true
# Amiberry 4:3 CRT framing option (amiberry_keep_aspect=false) (src: configgen)
amiberry_keep_aspect = false
# Amiberry 4:3 CRT framing option (amiberry_scalingmethod=pixelated) (src: configgen)
amiberry_scalingmethod = pixelated
[amiberryGenerator.py]
# Enforce CRT settings in generated emulator config (src: configgen)
amiberry.config = /userdata/system/configs/amiberry/amiberry.conf|default_correct_aspect_ratio=false;default_width=640;default_height=480

[amiga1200]

[amiga500]

[amiga_ransom]

# ── azahar ───────────────────────────────────────────────────────────────────
# 3DS (Azahar): custom layout stacks dual screens into 640x480 canvas without side pillars
[3ds]
[batocera.conf]
# CRT profile setting (azahar_screen_layout=6-false) (src: dump-config)
3ds.azahar_screen_layout = 6-false
[keypatch/configs/azahar-emu/qt-config.ini]
# Azahar two-screen layout: both screens stacked on the 4:3 canvas (src: dump-config)
Layout/custom_top_x = 0
Layout/custom_top_x\default = false
Layout/custom_top_y = 0
Layout/custom_top_y\default = false
Layout/custom_top_width = 640
Layout/custom_top_width\default = false
Layout/custom_top_height = 240
Layout/custom_top_height\default = false
Layout/custom_bottom_x = 0
Layout/custom_bottom_x\default = false
Layout/custom_bottom_y = 240
Layout/custom_bottom_y\default = false
Layout/custom_bottom_width = 640
Layout/custom_bottom_width\default = false
Layout/custom_bottom_height = 240
Layout/custom_bottom_height\default = false

# ── cemu ─────────────────────────────────────────────────────────────────────
# Wii U (Cemu): stretch aspect ratio
[wiiu]
[batocera.conf]
# Aspect setting (cemu_aspect=1) for 4:3 CRT fill (src: dump-config)
wiiu.cemu_aspect = 1
# HD/widescreen canvas wrapped via gamescope onto 4:3 CRT (src: dump-config)
wiiu.gamescope = 1
# Nearest-neighbor pixel filter for gamescope scaling (src: dump-config)
wiiu.gamescope_filter = pixel
# Standard 60Hz refresh for gamescope nested canvas (src: dump-config)
wiiu.gamescope_nested_refresh = 60
# Declared 864x486 game canvas inside gamescope (src: dump-config)
wiiu.gamescope_nested_resolution = 864x486
# 16:9 stretch output raster filling 4:3 CRT (src: dump-config)
wiiu.gamescope_output_resolution = 864x486
# Stretch nested canvas to fill 4:3 CRT without letterboxing (src: dump-config)
wiiu.gamescope_scaler = stretch
# Gamescope filter sharpness off for clean pixel downscale (src: dump-config)
wiiu.gamescope_sharpness = 0

