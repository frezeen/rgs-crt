# ── hypseus-singe ────────────────────────────────────────────────────────────
[emulator.hypseus-singe]
[batocera.conf]
# Force 4:3 aspect ratio in Hypseus Singe on CRT (src: configgen)
hypseus_ratio = force_ratio

[daphne]
[batocera.conf]
# 15kHz interlaced 480i CRT raster (src: dump-config)
daphne.videomode = 640x480i
[hypseusSingeGenerator.py]
# Drop stock CLI flags (-x -y) that conflict with 15kHz CRT output (src: configgen)
hypseus_singe.cli.drop = -x -y
# Force 4:3 CRT canvas flags (-x 640 -y 480) on generator CLI (src: configgen)
hypseus_singe.cli.append = -x 640 -y 480

[singe]
[batocera.conf]
# 15kHz interlaced 480i CRT raster (src: dump-config)
singe.videomode = 640x480i
# Keep native 3:4 portrait aspect on Fast Draw Showdown (480x640 video) (src: dump-config)
singe["fastdraw.daphne"].hypseus_ratio = original
[runtime]
fastdraw_bezel.apply = python3 /userdata/system/crt-dual/profiles/rgs-15khz/configs/nesica/bezel-overlay.py start /userdata/system/crt-dual/profiles/rgs-15khz/configs/singe/FastDraw_Bezel.png "fastdraw" 140
fastdraw_bezel.undo = python3 /userdata/system/crt-dual/profiles/rgs-15khz/configs/nesica/bezel-overlay.py stop

# ── libretro ─────────────────────────────────────────────────────────────────
# RetroArch: CRT SwitchRes mode 4 (INI driven) with 1920 dotclock ceiling
[emulator.libretro]
[libretroGenerator.py]
# Drop stock CLI flags (--set-shader) that conflict with 15kHz CRT output (src: configgen)
libretro.cli.drop = --set-shader
# Enforce CRT settings in generated emulator config (src: configgen)
libretro.config = /userdata/system/configs/retroarch/retroarchcustom.cfg|video_shader_enable=false;video_shader=""
[keypatch/configs/retroarch/retroarchcustom.cfg]
crt_switch_resolution = "4"
crt_switch_resolution_super = "1920"

# Flycast: disable RetroArch SwitchRes on fixed 640x480 native output (follows emulator.libretro)
[core.flycast]
[batocera.conf]
# Native 640x480 Flycast internal resolution for 480i CRT (src: configgen)
reicast_internal_resolution = 640x480
[keypatch/configs/retroarch/retroarchcustom.cfg]
# fixed 640x480 output: RetroArch SwitchRes off on this core (src: dump-config)
crt_switch_resolution = "0"

[atomiswave]

[c64]
[batocera.conf]
# squarepixel aspect fills 384x272 C64 frame without pillars (src: dump-config)
c64.ratio = squarepixel
# CRT profile setting (vice_external_palette=pepto-pal) (src: dump-config)
c64.vice_external_palette = pepto-pal
# CRT profile setting (vice_zoom_mode=disabled) (src: dump-config)
c64.vice_zoom_mode = disabled

# DOS (dosbox_pure): 4:3 CRT aspect on SwitchRes native modes (320x200/240p/480i)
[dos]
[batocera.conf]
# Force 4:3 CRT aspect ratio for DOS 16:10/4:3 video modes (src: configgen)
dos.ratio = 4/3

[dreamcast]
[batocera.conf]
# 15kHz interlaced 480i CRT raster (src: dump-config)
dreamcast.videomode = 640x480i
# 4:3 CRT aspect ratio, disabling widescreen hacks (src: dump-config)
dreamcast.ratio = 4/3
[keypatch/configs/retroarch/config/Flycast/dreamcast.opt]
reicast_internal_resolution = "640x480"
reicast_anisotropic_filtering = "off"
# TV (RGB) SCART cable boots non-VGA titles on 15kHz CRT (src: dump-config)
reicast_cable_type = "TV (RGB)"
# NTSC 60Hz broadcast standard matching 480i 60Hz CRT modeline (src: dump-config)
reicast_broadcast = "NTSC"
# Auto-detect game region across EUR/USA/JPN library (src: dump-config)
reicast_region = "Default"
reicast_widescreen_cheats = "disabled"
reicast_widescreen_hack = "disabled"

[fmtowns]
[batocera.conf]
# Use MAME/MESS libretro core with SwitchRes 240p/480i switching for FM Towns CD images (src: mame-driver)
fmtowns.core = mess
# Pin libretro:mess over configgen-defaults tsugaru (tsugaru lacks .chd) (src: dump-config)
fmtowns.emulator = libretro
[configs]
# MAME ini with ramsize 6M for the 4MB/6MB titles (src: mame-driver)
mame/fmtowns.ini = /userdata/bios/mame/ini/fmtowns.ini

# GBA: core 3:2 DAR in 720x480i container
[gba]
[batocera.conf]
# Aspect ratio core for 4:3 CRT framing (src: dump-config)
gba.ratio = core

# N64: parallel_n64 core dynamically tracks VI changes
[n64]
[batocera.conf]
# Pin parallel_n64 core for 15kHz CRT compatibility (src: dump-config)
n64.core = parallel_n64

[naomi]
[keypatch/configs/retroarch/config/Flycast/naomi.opt]
# fixed 640x480 native output, anisotropy off (src: dump-config)
reicast_internal_resolution = "640x480"
reicast_anisotropic_filtering = "off"

[naomi2]
[keypatch/configs/retroarch/config/Flycast/naomi2.opt]
# fixed 640x480 native output, anisotropy off (src: dump-config)
reicast_internal_resolution = "640x480"
reicast_anisotropic_filtering = "off"

# ── lindbergh-loader ─────────────────────────────────────────────────────────
[lindbergh]
[batocera.conf]
# Direct fullscreen on 640x480i raster without gamescope compositor (src: dump-config)
lindbergh.gamescope = 0
# Disable aspect lock (KEEP_ASPECT_RATIO=false) so 16:9 and 4:3 titles fill 4:3 CRT without letterboxing (src: dump-config)
lindbergh.lindbergh_aspect = 0
# 15kHz interlaced 480i CRT raster (src: dump-config)
lindbergh.videomode = 640x480i
[configs]
# Session NIC shield for the titles whose binary calls ifconfig/route (src: dump-config)
lindbergh/ifconfig = /sbin/ifconfig
lindbergh/route = /sbin/route

# ── linuxloader ──────────────────────────────────────────────────────────────
[emulator.linuxloader]
[batocera.conf]
# Wrap HD/widescreen emulator.linuxloader titles via gamescope onto 4:3 CRT (src: dump-config)
gamescope = 1
# Nearest-neighbor pixel filter for gamescope scaling (src: dump-config)
gamescope_filter = pixel
# Standard 60Hz refresh for gamescope nested canvas (src: dump-config)
gamescope_nested_refresh = 60
# Default 1280x720 nested canvas inside gamescope (src: dump-config)
gamescope_nested_resolution = 1280x720
# 16:9 stretch output raster (864x486) filling 4:3 CRT (src: dump-config)
gamescope_output_resolution = 864x486
# Stretch nested canvas to fill 4:3 CRT without letterboxing (src: dump-config)
gamescope_scaler = stretch
# Gamescope filter sharpness off for clean pixel downscale (src: dump-config)
gamescope_sharpness = 0
# Disable aspect lock so canvas fills 4:3 CRT raster (src: dump-config)
keep_aspect_ratio = off
# Default 640x480i 15kHz interlaced CRT raster for emulator.linuxloader (src: dump-config)
videomode = 640x480i

# ── mame ─────────────────────────────────────────────────────────────────────
[emulator.mame]
[mameGenerator.py]
# Drop stock CLI flags (-sound) that conflict with 15kHz CRT output (src: configgen)
mame.cli.drop = -sound

[mame]
[batocera.conf]
# CRT profile setting (artworkcrop=1) (src: dump-config)
mame.artworkcrop = 1
# Pin mame core for 15kHz CRT compatibility (src: dump-config)
mame.core = mame
# Pin mame emulator for 15kHz CRT compatibility (src: dump-config)
mame.emulator = mame
# CRT profile setting (switchres=1) (src: dump-config)
mame.switchres = 1
# CRT profile setting (video=accel) (src: dump-config)
mame.video = accel
[configs]
# MAME's own files: the mixer chain configgen parses and merges, plus the arcade ini (src: dump-config)
mame/default.cfg = configs/mame/default.cfg
mame/mame.ini = configs/mame/mame.ini
[binaries]
# GroovyMAME swap: the arcade binary is user-procured and never shipped (src: dump-config)
mame = /usr/bin/mame/mame

# ── moonlight ────────────────────────────────────────────────────────────────
[moonlight]
[batocera.conf]
# HD/widescreen canvas wrapped via gamescope onto 4:3 CRT (src: dump-config)
moonlight.gamescope = 1
# Nearest-neighbor pixel filter for gamescope scaling (src: dump-config)
moonlight.gamescope_filter = pixel
# Standard 60Hz refresh for gamescope nested canvas (src: dump-config)
moonlight.gamescope_nested_refresh = 60
# Declared 640x480 game canvas inside gamescope (src: dump-config)
moonlight.gamescope_nested_resolution = 640x480
# 4:3 CRT output raster for gamescope downscale (src: dump-config)
moonlight.gamescope_output_resolution = 640x480
# Stretch nested canvas to fill 4:3 CRT without letterboxing (src: dump-config)
moonlight.gamescope_scaler = stretch
# Gamescope filter sharpness off for clean pixel downscale (src: dump-config)
moonlight.gamescope_sharpness = 0

# ── odin ─────────────────────────────────────────────────────────────────────
[emulator.odin]
[batocera.conf]
# Odin 15kHz CRT option (odin_anisotropy=1) (src: odin-generator)
odin_anisotropy = 1
# Odin 15kHz CRT option (odin_api=opengl) (src: odin-generator)
odin_api = opengl
# Odin 15kHz CRT option (odin_bezel=off) (src: odin-generator)
odin_bezel = off
# Odin 15kHz CRT option (odin_filter=none) (src: odin-generator)
odin_filter = none
# Odin 15kHz CRT option (odin_scale=1) (src: odin-generator)
odin_scale = 1
# Odin 15kHz CRT option (odin_upscale_mode=raw) (src: odin-generator)
odin_upscale_mode = raw
# Odin 15kHz CRT option (odin_vsync=on) (src: odin-generator)
odin_vsync = on

[gaelco]
[batocera.conf]
# Native 4:3 titles (Odin, libretro SwitchRes, 640x480 Wine) run direct without gamescope (src: odin-generator)
gaelco.gamescope = 0
# Nearest-neighbor pixel filter for downscaled HD Wine packs (src: dump-config)
gaelco.gamescope_filter = pixel
# Standard 60Hz refresh for gamescope nested canvas (src: dump-config)
gaelco.gamescope_nested_refresh = 60
# 4:3 CRT output raster for downscaled Gaelco Wine packs (src: dump-config)
gaelco.gamescope_output_resolution = 640x480
# Stretch nested canvas cleanly onto 4:3 output raster (src: dump-config)
gaelco.gamescope_scaler = stretch
# Pixel filter sharpness off for downscaled HD Wine packs (src: dump-config)
gaelco.gamescope_sharpness = 0
# Texture anisotropy off matching Gaelco 3D hardware (src: odin-generator)
gaelco.odin_anisotropy = 1
# Odin native OpenGL backend, native 1:1 3D render (src: odin-generator)
gaelco.odin_api = opengl
# Disable internal Odin 16:9 bezels on 4:3 CRT tube (src: odin-generator)
gaelco.odin_bezel = off
# Disable fake CRT screen filters on real 15kHz CRT monitor (src: odin-generator)
gaelco.odin_filter = none
# Native 1x 640x480 3D resolution scale for 480i CRT raster (src: odin-generator)
gaelco.odin_scale = 1
# 2D HUD and text upscale mode raw as on original hardware (src: odin-generator)
gaelco.odin_upscale_mode = raw
# VSync on to lock display frames on CRT raster (src: odin-generator)
gaelco.odin_vsync = on
# Clear stock max-1920x1080 videomode on CRT so SwitchRes and 480i apply cleanly (src: dump-config)
gaelco.videomode =

# Radikal Bikers radikalb.dat requests 1920x1080; wrap via gamescope onto 640x480 4:3 CRT (src: dump-config)
gaelco["Radikal Bikers.wsquashfs"].gamescope = 1
# The pack saves its own 1920x1080 mode (no knob in the profile): the 1080p canvas stays (src: dump-config)
gaelco["Radikal Bikers.wsquashfs"].gamescope_nested_resolution = 1920x1080
# Ring Riders UserProfile sets Windowed=1 at 1920x1080; wrap via gamescope onto 640x480 4:3 CRT (src: dump-config)
gaelco["Ring Riders.wsquashfs"].gamescope = 1
# Its TP userprofile declares Windowed=1 at 1920x1080, prefix-owned: the 1080p canvas stays (src: dump-config)
gaelco["Ring Riders.wsquashfs"].gamescope_nested_resolution = 1920x1080
# Tokyo Cop UserProfile sets 1920x1440 (4:3); downscale 3:1 via gamescope onto 640x480i CRT (src: dump-config)
gaelco["Tokyo Cop.wsquashfs"].gamescope = 1
# Match TokyoCop.xml declared 1920x1440 4:3 canvas inside gamescope (src: dump-config)
gaelco["Tokyo Cop.wsquashfs"].gamescope_nested_resolution = 1920x1440

[hikaru]
[batocera.conf]
# 640x480 native 4:3 3D arcade canvas draws direct on real CRT raster without gamescope (src: odin-generator)
hikaru.gamescope = 0

# ── openmsx ──────────────────────────────────────────────────────────────────
# openMSX generator: disable CRT software filters and ensure skin fonts
[emulator.openmsx]
[openmsxGenerator.py]
# Disable software CRT filters in emulator XML settings (src: configgen)
openmsx.config.xml = /userdata/system/configs/openmsx/share/settings.xml|blur=0;scanline=0;glow=0
# Ensure stock DejaVuSans font is present in user share dir (src: dump-config)
