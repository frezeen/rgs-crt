ps2.pcsx2_mipmapping = 2
# CRT profile setting (pcsx2_texture_filtering=1) (src: dump-config)
ps2.pcsx2_texture_filtering = 1
# CRT profile setting (pcsx2_vsync=1) (src: dump-config)
ps2.pcsx2_vsync = 1

# ── pcsx2x6 ──────────────────────────────────────────────────────────────────
[namco2x6]
[batocera.conf]
# Direct fullscreen on 640x480i raster without gamescope compositor (src: pcsx2x6-generator)
namco2x6.gamescope = 0
# Raw native pixels without software bilinear blur (src: dump-config)
namco2x6.pcsx2_bilinear_filtering = 0
# Keep PS2 PCRTC anti-blur active for clean 480i CRT output (src: pcsx2x6-generator)
namco2x6.pcsx2_blur = true
# Unscaled 1x PS2 hardware dithering (src: pcsx2x6-generator)
namco2x6.pcsx2_dithering = 1
# Pin 4:3 FMV aspect so 480p attract/cutscenes do not squeeze to 3:2 (src: pcsx2x6-generator)
namco2x6.pcsx2_fmv_ratio = 4:3
# Disable FXAA post-process blur on CRT (src: pcsx2x6-generator)
namco2x6.pcsx2_fxaa = false
# Full PS2 hardware mipmapping (src: pcsx2x6-generator)
namco2x6.pcsx2_mipmapping = 2
# Pin 4:3 aspect for SDTV 480p title without letterboxing (src: dump-config)
namco2x6.pcsx2_ratio = 4:3
# Native 1x PS2/System 246/256 internal resolution without upscaling (src: pcsx2x6-generator)
namco2x6.pcsx2_resolution = 1
# Disable integer scaling so 448-line/512x448 titles fill 4:3 edge to edge (src: pcsx2x6-generator)
namco2x6.pcsx2_scaling = false
# Disable software TV/scanline shaders on real 15 kHz CRT (src: pcsx2x6-generator)
namco2x6.pcsx2_shaderset = 0
# PS2-authentic per-draw texture filtering keeps 2D HUD/sprites crisp (src: pcsx2x6-generator)
namco2x6.pcsx2_texture_filtering = 2
# Enable VSync to eliminate tearing on 60 Hz CRT (src: pcsx2x6-generator)
namco2x6.pcsx2_vsync = 1
# CRT profile setting (play_filter=false) (src: pcsx2x6-generator)
namco2x6.play_filter = false
# CRT profile setting (play_scale=1) (src: pcsx2x6-generator)
