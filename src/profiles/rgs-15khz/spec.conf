c64.vice_external_palette = pepto-pal
# squarepixel aspect fills 384x272 C64 frame without pillars
c64.ratio = squarepixel

[chihiro]
[batocera.conf]
# every Chihiro title draws 640x480@60p (31 kHz class, MAME chihiro.cpp driver); the tube raster is its interlaced 480i (src: mame-driver)
chihiro.videomode = 640x480i
# Vulkan backend prevents AMDGPU ring gfx timeout on RadeonSI
chihiro.xemu_chihiro_api = VULKAN
chihiro.gamescope = 0
chihiro.xemu_chihiro_render = 1
chihiro.xemu_chihiro_scaling = scale
chihiro.xemu_chihiro_aspect = auto
chihiro.xemu_chihiro_vsync = true
chihiro.xemu_chihiro_gamma = 1.0

