# ── Windows-pinball systems (RGS winebat launcher):
#    - pinballfx (2023, UE4): runs native 640x480i without gamescope. FILL 99.3-99.6%
#      (637x479 full-bleed 4:3) with correct optical proportions, reducing GPU
#      busy from 99.7% (1080p) / 47.5% (720p) down to 4.6% (solid 60 Hz).
#    - pinballfx2 (2013, DX9/11): runs native 640x480i without gamescope. FILL 99.6%
#      (639x479 full-bleed 4:3), GPU busy 1.5%.
#    - pinballm (2023, UE4): runs native 640x480i without gamescope. FILL 99.6%
#      (639x479 full-bleed 4:3), GPU busy drops from 99.2% (saturated judder)
#      down to 85.0% (smooth 60 Hz).
#    - pinballfx3 (2017, DX11): REQUIRES gamescope. The engine has a hardcoded
#      1080p config (graphics.cfg) and crashes with an unhandled page fault if run
#      directly at 640x480. Gamescope 1920x1080 canvas keeps it running stably at
#    - zaccariapinball: runs native 640x480i without gamescope. FILL 99.6%
#      (639x479 full-bleed 4:3), GPU busy 2.8%. ──
