# ── UNIS arcade (Windows packs under wine: HD LCD cabinets on the 4:3 tube) ──
[unis]
[batocera.conf]
# 15kHz CRT native resolution (src: dump-config)
unis.videomode = 640x480i
# 16:9 widescreen canvas fills the CRT tube via gamescope 864x486 stretch (src: dump-config)
unis.gamescope = 1
# Pixel filter sharpness for gamescope (src: dump-config)
unis.gamescope_sharpness = 0
# Pixel filter for gamescope (src: dump-config)
unis.gamescope_filter = pixel
# Gamescope 16:9 stretch output resolution for 4:3 CRT (src: dump-config)
unis.gamescope_output_resolution = 864x486
# Class canvas 1080p declared by most UNIS titles (src: dump-config)
unis.gamescope_nested_resolution = 1920x1080
# Standard 60Hz refresh for gamescope (src: dump-config)
unis.gamescope_nested_refresh = 60
# Stretch scaler fills the tube (src: dump-config)
unis.gamescope_scaler = stretch

# 720p canvases: Unity Screenmanager 1280x720 (src: dump-config)
unis["Dino Invasion (demul).wsquashfs"].gamescope_nested_resolution = 1280x720
# Elevator Action Invasion: the portrait 1080x1920 picture alone, true 9:16 (src: dump-config)
unis["Elevator Action Invasion (demul).wsquashfs"].gamescope_nested_resolution = 1080x1920
# 9:16 fitted on the 640x480 raster: 270x480 centred, its own art recomposed in the 185px pillars (src: dump-config)
unis["Elevator Action Invasion (demul).wsquashfs"].gamescope_output_resolution = 640x480
# fit keeps the portrait aspect inside the 4:3 output (src: dump-config)
unis["Elevator Action Invasion (demul).wsquashfs"].gamescope_scaler = fit
# 720p canvases: Unity Screenmanager 1280x720 (src: dump-config)
unis["Mighty Moto.wsquashfs"].gamescope_nested_resolution = 1280x720

# Dino Invasion saves its fullscreen size in the prefix (Unity Screenmanager): a run
# on a bare 640x480 desktop pinned it to 640x480 and gamescope pillar-boxes that 4:3
# window inside the 16:9 canvas. The title's own autorun.cmd carries Unity's screen
# args so it starts on the cabinet's 1280x720 canvas again (src: dump-config)
[configs]
unis/DinoInvasion_autorun.cmd = /userdata/system/wine-bottles/unis/GE-Proton11-10-x86_64/Dino Invasion (demul).wsquashfs.wine/autorun.cmd
# TeknoParrot's own bezel off: the game window is the bare portrait picture, its art is ours (src: dump-config)
unis/ElevatorActionInvasion.xml = /userdata/system/wine-bottles/unis/ge-custom/Elevator Action Invasion (demul).wsquashfs.wine/drive_c/teknoparrot/UserProfiles/ElevatorActionInvasion.xml

[runtime]
