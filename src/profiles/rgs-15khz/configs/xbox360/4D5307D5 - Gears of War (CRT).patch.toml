        value = 0x39600000

[[patch]]
    name = "Upscaling Fix - Disable Gaussian Blur (sharper, less bloom/DoF)"
    desc = "Forces the blur radius to 0, disabling gaussian blur. Helps upscaling without having to disable all post-processing."
    author = "boma"
    is_enabled = true

    [[patch.be8]]
        address = 0x8253956b
        value = 0x00
    [[patch.be8]]
