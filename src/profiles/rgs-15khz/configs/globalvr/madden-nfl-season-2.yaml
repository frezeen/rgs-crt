# EA SPORTS Madden NFL Football Season 2 (Global VR) — template override.
# The frontend (shell.exe) is a .NET 1.1 operator shell that crashes on modern Wine;
# starting the native Direct3D game executable directly (gvr/games/madden/mainapp.exe)
# bypasses the operator frontend while the payload (madden.rs) hooks the game's
# controls, dongle and cabinet monitors through MaddenInputRaw.dll.
system: globalvr
name: "EA SPORTS Madden NFL Football Season 2"

args: ['gvr/games/madden/mainapp.exe']

files:
  gvr/games/madden/msvcr71.dll: "{dump}/_Cabinet/System32/msvcr71.dll"
  gvr/games/madden/msvcp71.dll: "{dump}/_Cabinet/System32/msvcp71.dll"
  gvr/games/madden/pogoservicerelease.dll: "{dump}/gvr/games/madden/data0/pogoservicerelease.dll"
  gvr/games/madden/rmatrixsse2.dll: "{dump}/gvr/games/madden/data0/rmatrixsse2.dll"
  gvr/games/madden/rmatrixsse.dll: "{dump}/gvr/games/madden/data0/rmatrixsse.dll"
  gvr/games/madden/rmatrixfpu.dll: "{dump}/gvr/games/madden/data0/rmatrixfpu.dll"
