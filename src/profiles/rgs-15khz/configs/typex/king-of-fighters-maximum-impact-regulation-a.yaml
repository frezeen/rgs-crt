# King of Fighters Maximum Impact Regulation A (SNK, Taito Type X2) — the rest of
# the profile stays the stock template
# (systemprofiles/typex/king-of-fighters-maximum-impact-regulation-a.yaml).
# The CRI Sofdec video player uses a DirectDraw YUY2 overlay on wined3d GL.
# Mesa's multithreaded OpenGL (mesa_glthread) suffers a TLS fault in Wine WOW64
# (__pthread_getspecific+0xf SIGSEGV in gl0), while DRI3 vblank page flips on
# 640x480i interlaced mode trigger CS rejection in amdgpu (CS rejected -2).
# mesa_glthread: "false", LIBGL_DRI3_DISABLE: "1" and vblank_mode: "0" ensure
# stable, synchronous DRI2 presentation without driver drops.
system: typex
name: King of Fighters Maximum Impact Regulation A

env:
  mesa_glthread: "false"
  MESA_GLTHREAD: "false"
  vblank_mode: "0"
  LIBGL_DRI3_DISABLE: "1"
