<!-- Provided by the 15khz-crt profile: the audio MIXER chain (the
     "Mixer options -> Add router" setting that makes MAME audio
     audible with the PART backend on stock Batocera 43.1). configgen
     parses this file at gameStart and merges the controller ports in,
     keeping the <mixer> section intact (verified: a minidom parse ->
     rewrite preserves unknown tags). The four effects
     are the stock mixer chain the user configured manually. -->
<mameconfig version="10">
    <system name="default">
        <mixer>
            <audio_effects>
                <effect step="1" type="Filters" />
                <effect step="2" type="Compressor" />
                <effect step="3" type="Reverb" />
                <effect step="4" type="Equalizer" />
            </audio_effects>
            <!-- Pre-built mono route (empty node = default output, 0dB):
                 without it MAME shows "Add new full route" and stays
                 silent. Captured from a live menu-added route
                 (88games.cfg, 2026-09-05) so FRESH systems sing with zero
                 manual steps. Tag :mono covers mono drivers; stereo
                 games persist their own routes in per-game cfgs (which
                 this profile never touches). -->
            <sound_map tag=":mono">
                <node_mapping node="" db="0.000000" />
            </sound_map>
        </mixer>
    </system>
</mameconfig>
